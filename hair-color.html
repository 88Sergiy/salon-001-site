<!DOCTYPE html>
<html lang="uk">

<head>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
</head>

<body>

   

    <!-- Блок фарбувань -->
<section class="hair-color-hero">
    <div class="hair-color-overlay">
        
        <p>
            Від натуральних відтінків до яскравих експериментів — ми підбираємо колір, який пасує саме вам.
        </p>

        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="images/farb-blond.jpg" alt="Фарбування 1"></div>
                <div class="swiper-slide"><img src="images/farb1.jpg" alt="Фарбування 3"></div>
                <div class="swiper-slide"><img src="images/farb-chot.jpg" alt="Фарбування 4"></div>
                <div class="swiper-slide"><img src="images/farb-katerina.jpg" alt="Фарбування 5"></div>
                <div class="swiper-slide"><img src="images/farb-ruda.jpg" alt="Фарбування 6"></div>
                <div class="swiper-slide"><img src="images/farb2.jpg" alt="Фарбування 5"></div>
                <div class="swiper-slide"><img src="images/farb.jpg" alt="Фарбування 6"></div>
                <div class="swiper-slide"><img src="images/farb3.jpg" alt="Фарбування 6"></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </div>
</section>

    </main>

    <!-- Footer -->
    <footer>
        
    </footer>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- Swiper Initialization -->
    <script>
        const swiper = new Swiper(".mySwiper", {
            loop: true,
            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            },
            slidesPerView: 1,
            spaceBetween: 20,
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
        });
    </script>

</body>

</html>
