<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стрижки | SALON 001</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
</head>

<body>

    <main>
        <section class="hair-slider-section">
            <p class="slider-description">
                Наш майстер створює образи, які підкреслюють вашу індивідуальність — від класичних стрижок до сучасних
                укладок і святкових зачісок.
            </p>

            <div class="swiper haircut-slider">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="images/str1.jpg" alt="Стрижка 2"></div>
                    <div class="swiper-slide"><img src="images/str2.jpg" alt="Стрижка 3"></div>
                    <div class="swiper-slide"><img src="images/str4.jpg" alt="Стрижка 3"></div>
                    <div class="swiper-slide"><img src="images/ukladka.jpg" alt="Укладка"></div>
                    <div class="swiper-slide"><img src="images/ukladka-dva.jpg" alt="Укладка"></div>
                    <div class="swiper-slide"><img src="images/ukladka1.jpg" alt="Укладка"></div>
                </div>
                <div class="swiper-pagination"></div>
            </div>
        </section>
    </main>

    <footer>
     
    </footer>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.haircut-slider', {
            loop: true,
            autoplay: {
                delay: 3000,
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
        });
    </script>

</body>

</html>
